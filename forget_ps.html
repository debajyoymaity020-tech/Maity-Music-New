<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password | Maity Music</title>
<meta name="description" content="Reset your Maity Music account password with a quick OTP verification.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e6e9f2">
<link rel="stylesheet" href="CSS/forget_ps.css">
<link rel="apple-touch-icon" href="images/M-icon-512.png">
<link rel="icon" type="image/png" href="images/M-icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js" defer></script>
<script src="java script/forget_ps.js" defer></script>
</head>
<body>
<main>
<div class="show">
<p id="message" role="status" aria-live="polite"></p>
</div>
<div class="box">
<div class="m-box">
<div class="m">Maity</div>
<div class="s">♫</div>
<div class="m">Music</div>
</div>
<form action="" id="fp-form">
<div class="in-b">
<div class="input">
<input type="text" id="fp-id" placeholder="Enter Gmail or phone number" autocomplete="username" autocapitalize="off" spellcheck="false" aria-label="Gmail or phone number">
</div>
<button type="button" id="opt-btn">Send OTP</button>
</div>
<div class="in-u">
<div class="input">
<input type="text" id="fp-otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP Please" autocomplete="one-time-code" aria-label="6-digit OTP">
</div>
<button type="button" id="av">Verify OTP</button>
</div>
<div class="in-u">
<div class="input1">
<input type="password" id="fp-new" placeholder="Enter New Password" autocomplete="new-password" aria-label="New password">
</div>
</div>
<div class="in-u">
<div class="input1">
<input type="password" id="fp-confirm" placeholder="Confirm password" autocomplete="new-password" aria-label="Confirm new password">
</div>
</div>
<div class="lb">
<button type="button" id="rp"><b>Reset Password</b></button>
</div>
</form>
</div>
</main>
</body>
</html>
