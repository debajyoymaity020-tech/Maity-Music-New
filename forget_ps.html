<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/forget_ps.css">
    <link rel="apple-touch-icon" href="images/M-icon-512.png">
    <link rel="icon" type="image/png" href="images/M-icon-512.png">
    <title>Password reset page</title>
    <!-- Gmail e OTP pathanor jonno (EmailJS) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
    <script src="java script/forget_ps.js" defer></script>
</head>
<body>

    <h2 id="message"></h2>

    <div class="box">
        <div class="m-box">
            <div class="m">Maity</div>
            <div class="s">♫</div>
            <div class="m">Music</div>
        </div>
        <form action="" id="fp-form">
            <div class="in-b">
                <div class="input">
                    <input type="text" id="fp-id" placeholder="Enter Gmail or phone number" autocomplete="username">
                </div>
                <button type="button" id="opt-btn">Send OTP</button>
            </div>
            <div class="in-u">
                <div class="input">
                    <input type="text" id="fp-otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP Please" autocomplete="one-time-code">
                </div>
                <button type="button" id="av">Verify OTP</button>
            </div>
            <div class="in-u">
                <div class="input1">
                    <input type="password" id="fp-new" placeholder="Enter New Password" autocomplete="new-password">
                </div>
            </div>
            <div class="in-u">
                <div class="input1">
                    <input type="password" id="fp-confirm" placeholder="Confirm password" autocomplete="new-password">
                </div>
            </div>
            <div class="lb">
                <button type="button" id="rp"><b>Reset Password</b></button>
            </div>
            <p></p>
        </form>
    </div>

   
</body>
</html>
